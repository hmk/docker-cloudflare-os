# Hourly: check cloudflare/cloudflare-os for new commits and build/push a multi-arch image when
# there's one we haven't built yet. Stateless: "have we built this?" is answered by checking
# Docker Hub for the main-<sha> tag, not by tracking anything in this repo.
#
# Versioning: upstream publishes no tags or releases (its package.json "1.0.0" is boilerplate,
# not a version), so images carry no version tags of their own — builds are identified by the
# upstream commit they contain:
#   latest                          most recent successful build
#   main-<upstream short sha>       most recent build of that upstream commit
#   main-<upstream>-pkg-<packaging> that commit built with THIS repo's packaging — immutable
#   YYYYMMDD                        daily pointer (last build of that day wins)
# If upstream starts tagging releases, mirror their tags verbatim here.
#
# Why the -pkg- tag exists: an image is the product of two inputs, upstream's code and this
# repo's Dockerfile and patches. Tagging by upstream sha alone names only half of that, so a
# packaging-only change (a new patch, a Dockerfile fix) rebuilds the same main-<sha> tag with
# different contents — and anything that pinned it silently gets something else. Only the
# -pkg- tag is safe to pin: the other three all move by design.
#
# Secrets required (repo settings → secrets → actions):
#   DOCKERHUB_USERNAME / DOCKERHUB_TOKEN   for pushing to Docker Hub (Read & Write scope)
#   DOCKERHUB_RWD_TOKEN                    optional: Read/Write/Delete-scope token used only to
#                                          sync README.md to the Docker Hub Overview page (the
#                                          Hub API gates metadata updates above plain Write);
#                                          the sync step is skipped when this secret is absent
# The GHCR push uses the built-in GITHUB_TOKEN.
#
# If upstream changes conflict with patches/, the Dockerfile's `git apply --3way` step fails the
# build loudly — regenerate the patch against new upstream rather than shipping a broken image.

name: build

on:
  schedule:
    - cron: "23 * * * *"   # hourly, off the :00 rush
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]

concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: read
  packages: write   # push to GHCR

env:
  UPSTREAM_REPO: https://github.com/cloudflare/cloudflare-os.git
  IMAGE_NAME: cloudflare-os

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      sha: ${{ steps.upstream.outputs.sha }}
      short_sha: ${{ steps.upstream.outputs.short_sha }}
      date: ${{ steps.tags.outputs.date }}
      pkg_sha: ${{ steps.tags.outputs.pkg_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve upstream HEAD
        id: upstream
        run: |
          FULL_SHA=$(git ls-remote "$UPSTREAM_REPO" refs/heads/main | cut -f1)
          if [[ -z "$FULL_SHA" ]]; then echo "Failed to resolve upstream HEAD" >&2; exit 1; fi
          echo "sha=$FULL_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${FULL_SHA:0:9}" >> "$GITHUB_OUTPUT"
          echo "Upstream HEAD: $FULL_SHA"

      - name: Decide whether to build
        id: decide
        run: |
          # Check the tag naming BOTH inputs, not just upstream's. Keyed on main-<sha> alone, a
          # scheduled run would skip forever after a packaging change that never built (a failed
          # push run, say) — upstream's tag exists, so it looks done when it isn't.
          TAG="main-${{ steps.upstream.outputs.short_sha }}-pkg-$(git rev-parse --short=9 HEAD)"
          # Manual dispatch and pushes to this repo always rebuild (packaging may have changed);
          # scheduled runs skip when this exact upstream+packaging pair was already published.
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Build: forced (${{ github.event_name }})"
          elif docker manifest inspect \
              "${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME:$TAG" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Skip: $TAG already published"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Build: $TAG not yet published"
          fi

      - name: Compute tags
        if: steps.decide.outputs.build == 'true'
        id: tags
        run: |
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          # This repo's own commit — the packaging half of the image's identity. Paired with the
          # upstream sha it names both inputs, which is what makes that tag immutable and
          # therefore the only one worth pinning.
          echo "pkg_sha=$(git rev-parse --short=9 HEAD)" >> "$GITHUB_OUTPUT"

  # TypeScript's native compiler uses process.execve, which fails with ENOSYS under QEMU.
  # Build and smoke-test each architecture on a matching runner, then publish one manifest.
  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Load the native image for the smoke test; the digest push reuses its build cache.
      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: smoke-test:local
          build-args: |
            UPSTREAM_SHA=${{ needs.prepare.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8787:8787 smoke-test:local
          for i in $(seq 1 100); do
            echo "Waiting for HTTP readiness ($i/100)"
            if curl -sf -o /dev/null http://localhost:8787/; then
              echo "OK: serving"; docker rm -f smoke; exit 0
            fi
            if [ -n "$(docker ps -aq --filter name=smoke --filter status=exited)" ]; then
              echo "FAIL: container exited"; docker logs smoke; exit 1
            fi
            sleep 3
          done
          echo "FAIL: timed out"; docker logs smoke; exit 1

      - name: Push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,"name=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }},ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}",push-by-digest=true,name-canonical=true,push=true
          build-args: |
            UPSTREAM_SHA=${{ needs.prepare.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Cloudflare OS (cloudflare/cloudflare-os) self-hosted on workerd, upstream ${{ needs.prepare.outputs.short_sha }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.licenses=MIT

      - name: Export digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-architecture tags
        env:
          HUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          UPSTREAM: ${{ needs.prepare.outputs.short_sha }}
          PACKAGING: ${{ needs.prepare.outputs.pkg_sha }}
          DATE: ${{ needs.prepare.outputs.date }}
        run: |
          cd "$RUNNER_TEMP/digests"
          digests=(*)
          [[ ${#digests[@]} -eq 2 ]] || { echo "Expected two platform digests" >&2; exit 1; }
          for image in "$HUB_IMAGE" "$GHCR_IMAGE"; do
            tags=(-t "$image:latest" -t "$image:main-$UPSTREAM" -t "$image:main-$UPSTREAM-pkg-$PACKAGING")
            if [[ "$image" == "$HUB_IMAGE" ]]; then tags+=(-t "$image:$DATE"); fi
            sources=()
            for digest in "${digests[@]}"; do sources+=("$image@sha256:$digest"); done
            docker buildx imagetools create "${tags[@]}" "${sources[@]}"
            docker buildx imagetools inspect "$image:main-$UPSTREAM-pkg-$PACKAGING"
          done

      # Keep the Docker Hub Overview page in sync with README.md. Needs a Read/Write/Delete
      # token (DOCKERHUB_RWD_TOKEN) because the Hub API gates metadata updates above plain
      # Write; skipped when the secret isn't configured.
      # (The secrets context can't be used in `if:` expressions, hence the env indirection.)
      - name: Sync Docker Hub description
        if: env.RWD_TOKEN != ''
        env:
          RWD_TOKEN: ${{ secrets.DOCKERHUB_RWD_TOKEN }}
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_RWD_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          short-description: Cloudflare OS self-hosted on workerd — linuxserver.io-style image, auto-built from upstream
          readme-filepath: ./README.md
